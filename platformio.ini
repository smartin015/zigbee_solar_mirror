; PlatformIO Project Configuration File
;
; Zigbee solar-mirror router for the Seeed XIAO ESP32C6.
; Same servo wiring as the xiao_servo_waveshare_ST3215 project:
;   D8 (GPIO19) -> servo DATA, GND -> servo GND, external 6-12.6V -> servo VCC

[env:seeed_xiao_esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino

; Zigbee partition scheme
board_build.partitions = partitions_zigbee.csv

build_flags =
	-DZIGBEE_MODE_ZCZR=1
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
